<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tareas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Lista de tareas</h1>

    <form id="task-form" class="task-form">
      <label for="task-input" class="visually-hidden">Nueva tarea</label>
      <input type="text" id="task-input" placeholder="Escribe una tarea..." autocomplete="off" required>
      <button type="submit">Añadir</button>
    </form>

    <ul id="task-list" class="task-list" aria-live="polite"></ul>
    <p id="empty-message" class="empty-message">No hay tareas todavía.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
